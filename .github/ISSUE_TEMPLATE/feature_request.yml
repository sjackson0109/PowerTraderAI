name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then your idea. For open-ended questions or early ideas, use
        **Questions and ideas** (GitHub Discussions) on the "New issue" page.

        Don't include API keys, secrets or account details.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected, and what can't they do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should PowerTraderAI do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, and why they fall short.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hub GUI
        - Paper trading
        - Live trading
        - Strategies
        - Risk overlays
        - Backtester
        - Trainer/thinker
        - Market data
        - Exchange connection
        - Settings/migration
        - Other

  - type: dropdown
    id: live-risk
    attributes:
      label: Does this affect live trading or risk?
      description: For example order placement, position sizing, stop losses or risk overlays.
      options:
        - "Yes"
        - "No"
        - Not sure

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's done.
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots or examples.
