name: PowerTrader AI+ CI/CD

on:
  push:
    branches: [ main, development-*, feature/* ]
  pull_request:
    branches: [ main, development-* ]

# A new push to a pull request cancels the run it supersedes, so the full test suite
# never runs twice for one pull request. Pushes to branches always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Safety (dependency vulnerability scan)
      run: safety check --json --output safety-report.json || true

    - name: Run Bandit (security static analysis)
      run: bandit -r app/ -f json -o bandit-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 pylint pytest coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Black (code formatting check)
      run: black --check --diff app/

    - name: Run Flake8 (linting)
      run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Pylint
      run: pylint app/ --output-format=json > pylint-report.json || true

    - name: Upload code quality reports
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: pylint-report.json

  # The authoritative test run: every test under app/ (app/tests/ and app/test_*.py),
  # run from app/ exactly as the suite is run and proven locally. A failing, erroring
  # or uncollectable test fails this job; nothing in it ignores pytest's exit code.
  full-suite:
    # Windows and Python 3.13: where the suite is proven (README: 3.13 recommended),
    # and the Tk tests get a real desktop instead of skipping for want of a display.
    runs-on: windows-latest
    name: Full App Test Suite
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # As in the local runs. The isolation guard (app/tests/isolation.py, loaded by
      # app/conftest.py and app/tests/conftest.py) sets a temp POWERTRADER_HOME and an
      # in-memory keyring itself, and fails any test that touches the real user folders.
      PYTHONNOUSERSITE: '1'
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: app/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r app/requirements.txt pytest
        python -m pip list

    - name: Run the full app test suite
      id: pytest
      # The suite takes about 21 minutes here. Shorter than the job, so a hung test
      # still leaves time for the report steps.
      timeout-minutes: 50
      working-directory: app
      run: |
        set -o pipefail  # the job fails with pytest, not with tee
        # Outside the checkout: test_program_dir_read_only.py fails any test during
        # which a file inside the install folder changes, this log included.
        results="${RUNNER_TEMP//\\//}/test-results"
        echo "RESULTS_DIR=$results" >> "$GITHUB_ENV"
        mkdir -p "$results"
        python -u -m pytest -q -p no:cacheprovider -ra --durations=25 \
          -o junit_family=xunit1 --junitxml="$results/junit.xml" \
          -o faulthandler_timeout=900 \
          2>&1 | tee "$results/pytest.log"

    - name: Test summary
      if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
      run: >-
        python .github/scripts/junit_summary.py
        "$RESULTS_DIR/junit.xml" "$RESULTS_DIR/pytest.log"
        --title "Full app test suite (Windows, Python 3.13)" --prefix app/

    - name: Check that no test created the real user folders
      # The guard checks around every test; this also covers collection, imports and
      # anything still running after the last test. The runner starts without them.
      if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
      working-directory: app
      run: |
        python - <<'EOF'
        import os
        import sys

        os.environ.pop("POWERTRADER_HOME", None)
        import pt_paths

        kinds = ("config", "data", "log", "cache")
        folders = sorted({pt_paths._platform_dir(kind) for kind in kinds})
        found = [folder for folder in folders if os.path.exists(folder)]
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
            if found:
                out.write("**Isolation check FAILED**: created during the run: ")
                out.write(", ".join(f"`{folder}`" for folder in found) + "\n")
            else:
                out.write("Isolation check passed: no real user folder exists after the run.\n")
        for folder in found:
            print(f"::error title=Isolation check::the run created {folder}")
        print("\n".join(f"{'FOUND' if f in found else 'absent'}  {f}" for f in folders))
        sys.exit(1 if found else 0)
        EOF

    - name: Upload test results
      if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: full-app-test-suite-results
        path: ${{ env.RESULTS_DIR }}
        if-no-files-found: warn
        retention-days: 30

  # A required check ("Protect main"). app/tests/test_integration.py now runs inside the
  # Full App Test Suite, under the isolation guard, so this job reports that job's result
  # instead of running the file a second time.
  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: [full-suite]
    if: ${{ always() && github.event_name == 'pull_request' }}

    steps:
    - name: Integration tests (run in the Full App Test Suite)
      run: |
        echo "Full App Test Suite: ${{ needs.full-suite.result }}"
        test "${{ needs.full-suite.result }}" = "success"

  deployment-check:
    runs-on: ubuntu-latest
    name: Deployment Readiness
    needs: [security-scan, code-quality, full-suite, integration-test]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Check for production readiness
      run: |
        echo "Checking production readiness..."
        # Verify all critical files exist
        test -f app/pt_hub.py || exit 1
        test -f requirements.txt || exit 1
        test -f TODO.md || exit 1

        # Check for security issues in production code
        grep -r "r_key.txt\|r_secret.txt" app/ && echo "ERROR: Plaintext credentials found" && exit 1 || echo "✓ No plaintext credentials"
        grep -r "except:" app/ | wc -l | awk '{ if ($1 > 5) { print "ERROR: Too many bare except blocks:", $1; exit 1 } else { print "✓ Acceptable number of bare except blocks:", $1 } }'

        echo "✓ Deployment readiness check passed"

  notify-completion:
    runs-on: ubuntu-latest
    name: Notify Completion
    needs: [security-scan, code-quality, full-suite]
    if: always()

    steps:
    - name: Notify CI/CD completion
      # The test suite must have passed: failed, cancelled or timed out all count.
      run: |
        echo "Full App Test Suite: ${{ needs.full-suite.result }}"
        if [ "${{ needs.security-scan.result }}" == "failure" ] || [ "${{ needs.code-quality.result }}" == "failure" ] || [ "${{ needs.full-suite.result }}" != "success" ]; then
          echo "❌ CI/CD pipeline failed - please review the failed checks"
          exit 1
        else
          echo "✅ CI/CD pipeline completed successfully"
        fi
